name: Generate metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats and language cards
        env:
          # Optional: add a METRICS_TOKEN repo secret (classic PAT, scope: repo) to count private repos too.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_INCLUDE_PRIVATE: ${{ secrets.METRICS_TOKEN != '' && '1' || '0' }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: python scripts/generate_stats.py

      - name: Push to metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

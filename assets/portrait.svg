<svg xmlns="http://www.w3.org/2000/svg" width="838" height="410" viewBox="0 0 838 410" role="img" aria-label="ASCII portrait of Sawyer McKenney">
<style>
  .r { font: 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; opacity: 0; animation: gen 14s linear infinite; }
  .nm { font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; --c: #F0F6FC; fill: #F0F6FC; opacity: 0; animation: gen 14s linear infinite; }
  .n { --c: #C9D1D9; fill: #C9D1D9; }
  .b { --c: #F0F6FC; fill: #F0F6FC; }
  .cursor { fill: #58A6FF; opacity: 0; animation: scan 14s linear infinite; }
  @keyframes gen {
    0% { opacity: 0; fill: #58A6FF; }
    6.43% { opacity: 1; }
    10.71% { fill: var(--c); }
    86.29% { opacity: 1; }
    97.00% { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0.55; }
    24.43% { transform: translateY(378px); opacity: 0.55; }
    26.57% { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
